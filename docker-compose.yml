version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-with-my-digital-twin-backend
    ports:
      - "3099:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - PG_DSN=${PG_DSN:-postgresql://postgres:postgres@localhost:5432/twin_db}
      - TRACKER_DB=/app/data/abuse_tracker.db
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    restart: always
