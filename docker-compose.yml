version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview-with-my-digital-twin-backend
    ports:
      - "3099:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_URL=http://100.64.0.1:11434
      - PG_DSN=postgresql://mps:mps-db-super-secret-pass-2026-alpha@100.64.0.2:5432/your_pgdb_name
      - TRACKER_DB=/app/data/abuse_tracker.db
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    restart: always
